<title>تقييم النظام</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#fffefb;--bd:#e4dfd5;--tx:#1b1915;--tx2:#585248;--ac:#0f6b4f;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#131210;--card:#1c1a17;--bd:#332f29;--tx:#f3f0e9;--tx2:#b5aea2;--ac:#4fb58e;--er:#e07a6e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
 font-family:"IBM Plex Sans Arabic","Segoe UI",Arial,sans-serif;padding:20px;direction:rtl}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:32px 26px;width:100%;max-width:370px;text-align:center}
h1{font-size:18px;margin:0 0 6px;font-weight:700}
p{color:var(--tx2);font-size:13.5px;margin:0 0 22px;line-height:1.7}
input{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);
 color:var(--tx);font-size:16px;font-family:inherit;text-align:center;margin-bottom:11px}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
button{width:100%;padding:12px;border:none;border-radius:9px;background:var(--ac);color:#fff;
 font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--er);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>

<script>
(function(){
  var D=JSON.parse(document.getElementById("payload").textContent);
  var f=document.getElementById("f"),p=document.getElementById("p"),
      b=document.getElementById("b"),e=document.getElementById("e");
  function b64(s){var x=atob(s),a=new Uint8Array(x.length);
    for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a;}
  f.addEventListener("submit",async function(ev){
    ev.preventDefault(); if(!p.value)return;
    b.disabled=true;b.textContent="بيفتح…";e.textContent="";
    try{
      var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p.value),{name:"PBKDF2"},false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},
        km,{name:"AES-GCM",length:256},false,["decrypt"]);
      var o=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
      document.open();document.write(new TextDecoder().decode(o));document.close();
    }catch(err){ e.textContent="الباسورد غلط"; b.disabled=false; b.textContent="فتح"; p.value=""; p.focus(); }
  });
})();
</script>
